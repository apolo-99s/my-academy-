// ============================================
// SUPABASE CLIENT
// ============================================
async function initSupabase() {
  try {
    const { createClient } = await import('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm');
    supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    
    const { error } = await supabase.from('skills_content').select('count', { count: 'exact', head: true });
    
    if (!error) {
      supabaseConnected = true;
      console.log('✅ Supabase connecté');
      return true;
    } else {
      console.warn('⚠️ Supabase erreur:', error);
      supabaseConnected = false;
      return false;
    }
  } catch (e) {
    console.warn('⚠️ Supabase non disponible');
    supabaseConnected = false;
    return false;
  }
}

// ============================================
// LOAD SKILLS (Supabase + Fallback)
// ============================================
async function loadSkills() {
  try {
    if (supabaseConnected && supabase) {
      // Récupérer depuis skills_content
      const { data: skillsList, error: listError } = await supabase
        .from('skills_content')
        .select('skill_id, sort_order, payload')
        .order('sort_order', { ascending: true });
      
      if (!listError && skillsList && skillsList.length > 0) {
        console.log('📡 Skills chargés depuis Supabase:', skillsList.length);
        
        // Transformer les données
        skillsData = skillsList.map(item => {
          const p = item.payload || {};
          return {
            id: item.skill_id,
            sort_order: item.sort_order,
            icon: p.icon || '🎯',
            color: p.color || '#7C3AED',
            accent: p.accent || '#A78BFA',
            bg: p.bg || '#0D0818',
            earning: p.earning || '0 DZD',
            title: p.title || { fr: 'Skill', ar: 'مهارة', en: 'Skill' },
            subtitle: p.subtitle || { fr: '', ar: '', en: '' },
            tagline: p.tagline || { fr: '', ar: '', en: '' },
            levels: p.levels || [],
            firstClient: p.firstClient || { fr: '4 semaines', ar: '4 أسابيع', en: '4 weeks' },
            startTool: p.startTool || ''
          };
        });
        
        usingSupabase = true;
        updateUI();
        updateStatus('Supabase');
        return skillsData;
      }
    }
    
    // Fallback: données locales
    console.log('📦 Utilisation des données locales (fallback)');
    skillsData = getFallbackSkills();
    usingSupabase = false;
    updateUI();
    updateStatus('Local');
    return skillsData;
    
  } catch (e) {
    console.warn('⚠️ Erreur, fallback vers données locales');
    skillsData = getFallbackSkills();
    usingSupabase = false;
    updateUI();
    updateStatus('Local');
    return skillsData;
  }
}

// ============================================
// CHECK ACCESS (Supabase + Fallback)
// ============================================
async function checkAccessCode(code) {
  if (supabaseConnected && supabase) {
    try {
      const { data, error } = await supabase
        .from('access_codes')
        .select('*')
        .eq('code', code)
        .eq('used', false)
        .single();
      
      if (!error && data) {
        await supabase.from('access_codes').update({ used: true, used_at: new Date().toISOString() }).eq('code', code);
        return true;
      }
    } catch (e) {}
  }
  return FALLBACK_CODES.includes(code);
}

async function checkAccess() {
  const t = T[lang];
  const val = document.getElementById('access-input').value.trim().toUpperCase();
  const errEl = document.getElementById('access-error');
  const btn = document.getElementById('access-btn');
  
  if (!val) { errEl.textContent = t.errEmpty; errEl.style.display = 'block'; return; }
  
  const isValid = await checkAccessCode(val);
  
  if (!isValid) {
    errEl.textContent = t.errInvalid;
    errEl.style.display = 'block';
    return;
  }
  
  const used = JSON.parse(localStorage.getItem('usedCodes') || '[]');
  if (used.includes(val)) {
    errEl.textContent = t.errUsed;
    errEl.style.display = 'block';
    return;
  }
  
  btn.textContent = t.loading;
  btn.disabled = true;
  
  setTimeout(() => {
    used.push(val);
    localStorage.setItem('usedCodes', JSON.stringify(used));
    localStorage.setItem('hasAccess', 'true');
    hasAccess = true;
    renderAcademy();
  }, 900);
}

function clearErr() {
  document.getElementById('access-error').style.display = 'none';
  document.getElementById('access-input').classList.remove('err');
  document.getElementById('access-btn').textContent = T[lang].access;
  document.getElementById('access-btn').disabled = false;
}

    <p style="color:#6B7280;font-size:13px;margin:0"><strong style="color:#9CA3AF">${t.goal}:</strong> ${lv.goal[lang] || lv.goal.fr || lv.goal || ''}</p>
  `;
  
  document.getElementById('lesson-cards').innerHTML = lessons.map((les, i) => {
    const lesTitle = les.title[lang] || les.title.fr || les.title || `Leçon ${i+1}`;
    const stepCount = (les.steps[lang] || les.steps.fr || les.steps || []).length;
    return `<div class="lesson-card" onclick="goLesson(${i})" onmouseenter="this.style.borderColor='${color}66'" onmouseleave="this.style.borderColor='#1C1C28'">
      <span class="lesson-num" style="background:${color}22;border:1px solid ${color}44;color:${accent}">${i+1}</span>
      <div class="lesson-info"><div class="lesson-title-text">${lesTitle}</div><div class="lesson-meta">${stepCount} steps · includes exercise</div></div>
      <span style="color:#374151;font-size:20px;flex-shrink:0;transform:${isAr ? 'rotate(180deg)' : 'none'}">→</span>
    </div>`;
  }).join('');
  
  let nav = '';
  if (levelIdx > 0) { const prevName = levels[levelIdx-1]?.name[lang] || levels[levelIdx-1]?.name.fr || 'Précédent'; nav += `<button class="nav-prev" onclick="goLevel(${levelIdx-1})">${isAr ? '→' : '←'} ${prevName}</button>`; }
  else nav += `<button class="nav-prev" onclick="renderAcademy()">${isAr ? '→' : '←'} ${t.backSkills}</button>`;
  if (levelIdx < levels.length - 1) { const nextName = levels[levelIdx+1]?.name[lang] || levels[levelIdx+1]?.name.fr || 'Suivant'; nav += `<button class="nav-next" style="background:${color}" onclick="goLevel(${levelIdx+1})">${nextName} ${isAr ? '←' : '→'}</button>`; }
  document.getElementById('level-nav').innerHTML = nav;
  showView('skill-view');
}

// ============================================
// RENDER LESSON
// ============================================
function goLesson(i) { lessonIdx = i; openStep = null; renderLesson(); }
function prevLesson() { lessonIdx--; openStep = null; renderLesson(); }
function nextLesson() { lessonIdx++; openStep = null; renderLesson(); }
function nextLevel() { levelIdx++; lessonIdx = null; renderSkill(); }
function toggleStep(i) { openStep = openStep === i ? null : i; renderLesson(); }

function renderLesson() {
  const t = T[lang];
  const data = skillsData.length > 0 ? skillsData : getFallbackSkills();
  const sk = data.find(s => s.id === skillId);
  if (!sk) { showNotification('⚠️ Skill non trouvé'); return; }
  
  const levels = sk.levels || [];
  const lv = levels[levelIdx] || levels[0] || { name: { fr: 'Niveau', ar: 'مستوى', en: 'Level' }, badge: '📘', lessons: [] };
  const lessons = lv.lessons || [];
  const les = lessons[lessonIdx];
  if (!les) { showNotification('⚠️ Leçon non trouvée'); return; }
  
  const isAr = lang === 'ar';
  const isMobile = window.innerWidth < 600;
  const steps = les.steps[lang] || les.steps.fr || les.steps || [];
  const layout = les.layout || 'top';
  const showLeft = layout === 'left' && !isMobile;
  const showRight = layout === 'right' && !isMobile;
  const color = sk.color || '#7C3AED';
  const accent = sk.accent || '#A78BFA';
  
  document.getElementById('lesson-back-btn').textContent = `${isAr ? '→' : '←'} ${t.back.replace(/[←→]/g, '').trim()}`;
  document.getElementById('lesson-back-btn').onclick = () => renderSkill();
  document.getElementById('lesson-skill-icon').textContent = sk.icon || '🎯';
  document.getElementById('lesson-skill-name').textContent = sk.title[lang] || sk.title.fr || sk.title || 'Skill';
  document.getElementById('lesson-level-name').textContent = lv.name[lang] || lv.name.fr || lv.name || 'Level';
  document.getElementById('lesson-counter').textContent = `${t.lesson} ${lessonIdx+1} ${t.of} ${lessons.length}`;
  document.getElementById('lv-footer').textContent = t.footer;
  
  const lesTitle = les.title[lang] || les.title.fr || les.title || `Leçon ${lessonIdx+1}`;
  const lesImage = les.image || '';
  
  let imgTop = '';
  let imgSide = '';
  if (lesImage && (layout === 'top' || isMobile)) imgTop = `<img class="lesson-img-top" src="${lesImage}" alt="${lesTitle}" loading="lazy">`;
  else if (lesImage && (showLeft || showRight)) imgSide = `<div class="steps-side-img"><img src="${lesImage}" alt="${lesTitle}" loading="lazy"></div>`;
  
  const stepsHTML = steps.map((step, i) => {
    const isOpen = openStep === i;
    const preview = step.length > 80 && !isOpen ? step.substring(0, 80) + '…' : step;
    return `<div class="step-item" style="border-color:${isOpen ? color + '60' : '#1C1C28'}">
      <button class="step-btn" onclick="toggleStep(${i})">
        <span class="step-num" style="${isOpen ? 'background:' + color + ';color:#fff' : ''}">${i+1}</span>
        <span class="step-text" style="color:${isOpen ? '#fff' : '#9CA3AF'};font-weight:${isOpen ? 600 : 400};text-align:${isAr ? 'right' : 'left'}">${preview}</span>
        <span class="step-toggle">${isOpen ? '▲' : '▼'}</span>
      </button>
      ${isOpen ? `<div class="step-expanded" style="display:block;padding:${isAr ? '0 52px 16px 16px' : '0 16px 16px 52px'}">${step}</div>` : ''}
    </div>`;
  }).join('');
  
  let stepsWrap = '';
  if (showLeft) stepsWrap = `<div class="steps-with-img">${imgSide}<div class="steps-list">${stepsHTML}</div></div>`;
  else if (showRight) stepsWrap = `<div class="steps-with-img" style="flex-direction:row-reverse">${imgSide}<div class="steps-list">${stepsHTML}</div></div>`;
  else stepsWrap = `<div class="steps-list">${stepsHTML}</div>`;
  
  const hasPrev = lessonIdx > 0;
  const hasNext = lessonIdx < lessons.length - 1;
  const hasNextLv = levelIdx < levels.length - 1;
  
  let prevBtn = hasPrev ? `<button class="lesson-nav-prev" onclick="prevLesson()">${isAr ? '→' : '←'} ${t.prevLesson.replace(/[←→]/g, '').trim()}</button>` : `<button class="lesson-nav-prev" onclick="renderSkill()">${isAr ? '→' : '←'} ${t.back.replace(/[←→]/g, '').trim()}</button>`;
  let nextBtn = hasNext ? `<button class="lesson-nav-next" style="background:${color}" onclick="nextLesson()">${t.nextLesson.replace(/[←→]/g, '').trim()} ${isAr ? '←' : '→'}</button>` : hasNextLv ? `<button class="lesson-nav-next" style="background:${color}" onclick="nextLevel()">${t.nextLevel}: ${levels[levelIdx+1]?.name[lang] || levels[levelIdx+1]?.name.fr || 'Suivant'} ${isAr ? '←' : '→'}</button>` : `<div class="lesson-complete" style="color:${accent};border-color:${color}50">${t.complete}</div>`;
  
  const method = les.method[lang] || les.method.fr || les.method || '';
  const exercise = les.exercise[lang] || les.exercise.fr || les.exercise || '';
  const tip = les.tip[lang] || les.tip.fr || les.tip || '';
  
  document.getElementById('lesson-body').innerHTML = `
    <div style="margin-bottom:20px"><span style="background:#1C1C28;border:1px solid ${color}44;color:${accent};border-radius:8px;padding:4px 12px;font-size:12px;font-weight:600">${lv.badge || '📘'} ${lv.name[lang] || lv.name.fr || lv.name}</span><span style="font-size:12px;color:#374151;margin-left:8px">${t.lesson} ${lessonIdx+1}</span></div>
    <h1 style="font-size:clamp(20px,4vw,28px);font-weight:800;color:#fff;margin:0 0 24px;line-height:1.25">${lesTitle}</h1>
    ${imgTop}
    <div style="margin-bottom:28px"><div class="steps-header"><div class="steps-bar" style="background:${color}"></div><span class="steps-label">${t.howTo}</span></div>${stepsWrap}</div>
    ${method ? `<div class="method-box" style="background:#0A0E18;border-color:${color}30"><div class="box-header"><span class="box-emoji">🧠</span><span class="box-label" style="color:${accent}">${t.bestWay}</span></div><p class="box-text" style="color:#9CA3AF">${method}</p></div>` : ''}
    ${exercise ? `<div class="method-box" style="background:#0E0A00;border-color:#92400E40"><div class="box-header"><span class="box-emoji">💪</span><span class="box-label" style="color:#FCD34D">${t.exercise}</span></div><p class="box-text" style="color:#D97706">${exercise}</p></div>` : ''}
    ${tip ? `<div class="tip-box"><p style="color:#6B7280;font-size:13px;line-height:1.65;margin:0">${tip}</p></div>` : ''}
    <div class="lesson-nav">${prevBtn}${nextBtn}</div>
  `;
  showView('lesson-view');
}

// ============================================
// REFRESH & SYNC
// ============================================
async function refreshData() {
  showNotification('🔄 Rafraîchissement...');
  await loadSkills();
  showNotification('✅ Données mises à jour!');
  if (hasAccess) renderAcademy();
  else renderLanding();
}

function setupAutoSync() {
  if (!supabaseConnected) {
    console.log('⏳ Auto-sync non disponible');
    return;
  }
  if (syncInterval) clearInterval(syncInterval);
  syncInterval = setInterval(async () => {
    console.log('🔄 Auto-sync check...');
    await loadSkills();
    if (hasAccess && document.getElementById('academy').style.display !== 'none') renderAcademy();
  }, 30000);
  console.log('✅ Auto-sync activé (30s)');
}

function stopAutoSync() {
  if (syncInterval) { clearInterval(syncInterval); syncInterval = null; console.log('⏹️ Auto-sync désactivé'); }
}

function toggleMode() {
  if (syncInterval) { stopAutoSync(); showNotification('⏹️ Auto-sync désactivé'); }
  else { setupAutoSync(); showNotification('🔄 Auto-sync activé (30s)'); }
}

function showNotification(message) {
  document.querySelectorAll('.notification').forEach(el => el.remove());
  const div = document.createElement('div');
  div.className = 'notification';
  div.textContent = message;
  document.body.appendChild(div);
  setTimeout(() => { div.style.opacity = '0'; div.style.transition = 'opacity 0.3s'; setTimeout(() => div.remove(), 300); }, 2000);
}

// ============================================
// INIT
// ============================================
document.addEventListener('DOMContentLoaded', async () => {
  document.documentElement.lang = lang;
  document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
  
  document.querySelectorAll('.lang-btn').forEach(b => {
    const lbl = b.textContent.trim();
    b.classList.toggle('active', (lang === 'fr' && lbl === 'FR') || (lang === 'ar' && lbl === 'ع') || (lang === 'en' && lbl === 'EN'));
  });
  
  await initSupabase();
  await loadSkills();
  setupAutoSync();
  
  if (hasAccess) renderAcademy();
  else renderLanding();
  
  console.log('🚀 Digital Skills Academy prêt!');
});

// Expose
window.setLang = setLang;
window.goHome = goHome;
window.checkAccess = checkAccess;
window.clearErr = clearErr;
window.goSkill = goSkill;
window.goLevel = goLevel;
window.goLesson = goLesson;
window.prevLesson = prevLesson;
window.nextLesson = nextLesson;
window.nextLevel = nextLevel;
window.toggleStep = toggleStep;
window.refreshData = refreshData;
window.toggleMode = toggleMode;
</script>
</body>
